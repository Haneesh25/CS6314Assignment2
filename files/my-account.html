<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Deals - My Account</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Travel Deals</h1>
            <div class="header-info">
                <div id="datetime"></div>
                <div id="userInfo">Loading...</div>
            </div>
        </header>

        <nav class="horizontal-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="stays.html">Stays</a></li>
                <li><a href="flights.html">Flights</a></li>
                <li><a href="cars.html">Cars</a></li>
                <li><a href="cruise.html">Cruise</a></li>
                <li><a href="contact-us.html">Contact Us</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="my-account.html" class="active">My Account</a></li>
            </ul>
        </nav>

        <div class="content-wrapper">
            <aside class="sidebar">
                <h3>Quick Links</h3>
                <div class="customization">
                    <h4>Customize View</h4>
                    <label for="fontSize">Font Size:</label>
                    <select id="fontSize">
                        <option value="14px">Small</option>
                        <option value="16px" selected>Medium</option>
                        <option value="18px">Large</option>
                        <option value="20px">Extra Large</option>
                    </select>
                    <br><br>
                    <label for="bgColor">Background Color:</label>
                    <input type="color" id="bgColor" value="#ffffff">
                </div>
            </aside>

            <main class="main-content">
                <h2>My Account</h2>
                
                <div id="accountInfo" style="margin-bottom: 30px;">
                    <h3>Account Information</h3>
                    <div id="userDetails"></div>
                </div>

                <div id="adminSection" style="display:none;">
                    <h3>Admin Section</h3>
                    <div class="admin-panel">
                        <h4>Load Flights from JSON</h4>
                        <form id="uploadForm">
                            <input type="file" id="flightsFile" accept=".json">
                            <button type="submit" class="btn">Upload Flights</button>
                        </form>
                        <div id="uploadMessage" style="margin-top: 10px;"></div>
                    </div>
                </div>

                <div id="bookingHistory" style="margin-top: 30px;">
                    <h3>My Bookings</h3>
                    <div id="bookingsList">
                        <p>No bookings yet.</p>
                    </div>
                </div>
            </main>
        </div>

        <footer>
            <p>&copy; 2024 Travel Deals. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="common.js"></script>
    <script src="my-account.js"></script>
</body>
</html>
